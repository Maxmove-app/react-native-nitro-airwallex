includeBuild(new File(providers.exec {
    workingDir(file('../..'))
    commandLine('node', '--print', "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
  }.standardOutput.asText.get().trim()).parentFile)
rootProject.name = 'NitroAirwallexNativeTests'
include ':app', ':react-native-nitro-airwallex', ':react-native-nitro-modules'
project(':react-native-nitro-airwallex').projectDir = file('../../android')
project(':react-native-nitro-modules').projectDir = new File(providers.exec {
  workingDir(file('../..'))
  commandLine('node', '--print', "require.resolve('react-native-nitro-modules/package.json')")
}.standardOutput.asText.get().trim()).parentFile.toPath().resolve('android').toFile()
